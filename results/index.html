<!--
  Results viewer for reports whose QR carries the results (Catenix
  src/patient_retrieval/qr_payload.py). Everything after "#" stays in this browser
  and is never sent to labsyria.com or anywhere else. The page fetches only
  labs.json (the laboratories' public keys), checks the laboratory's signature,
  and, for locked codes (version 2), decrypts with the patient's date of birth
  here on the phone. No analytics on this page, by design.
-->
<style>
:root{--ink:#0F2239;--body:#3D4F63;--muted:#6C7B8B;--line:#E6ECE9;--paper:#F5F8F6;--ok:#0A8F3A;--red:#C0182B;--blue:#1C6FD1;--brand:#172E4B;--brand2:#0B7B79}
*{box-sizing:border-box}
html,body{margin:0;background:linear-gradient(180deg,#E6EEEB 0,#F3F6F5 340px);color:var(--body);font-family:"Readex Pro",system-ui,sans-serif;font-size:16px;line-height:1.55;min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding:14px 14px 28px}
.card{background:#fff;border-radius:22px;box-shadow:0 10px 30px rgba(15,34,57,.08),0 1px 0 rgba(15,34,57,.04);overflow:hidden}
.hd{position:relative;background:linear-gradient(135deg,var(--brand) 0%,var(--brand2) 100%);color:#fff;padding:22px 22px 54px}
.hd .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hd h1{font-family:"Alexandria",sans-serif;font-size:1.25rem;margin:0;line-height:1.35}
.hd .sub{opacity:.82;font-size:.86rem;margin-top:2px}
.hd .logo{background:#fff;border-radius:12px;padding:6px 8px;display:flex}
.hd .logo img{max-height:42px;max-width:110px;display:block}
.hd .mono-ic{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-family:"Alexandria",sans-serif;font-size:1.25rem}
.seal{margin:-34px 16px 0;position:relative;background:#fff;border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 18px rgba(15,34,57,.10)}
.seal .ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem;color:#fff}
.seal.ok .ic{background:var(--ok)} .seal.wait .ic{background:var(--muted)}
.seal b{display:block;color:var(--ink);font-family:"Alexandria",sans-serif;font-size:.98rem}
.seal span{font-size:.84rem;color:var(--muted)}
.pt{padding:18px 20px 6px}
.pt .name{font-family:"Alexandria",sans-serif;font-size:1.3rem;color:var(--ink);line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.82rem}
.chip b{color:var(--ink);font-weight:500}
.mono{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.sum{margin:14px 16px 4px;border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:center}
.sum.ok{background:#EAF7EF} .sum.ab{background:#FFF3F1}
.sum .big{font-family:"Alexandria",sans-serif;font-size:1.6rem;line-height:1;min-width:58px;text-align:center}
.sum.ok .big{color:var(--ok)} .sum.ab .big{color:var(--red)}
.sum .txt{font-size:.92rem;color:var(--ink)}
.sum .txt small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.grp{padding:6px 16px 4px}
.grp h2{font-family:"Alexandria",sans-serif;font-size:.95rem;color:var(--brand2);margin:14px 4px 8px;display:flex;align-items:center;gap:8px}
.grp h2:after{content:"";flex:1;height:1px;background:var(--line)}
.res{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;background:#fff}
.res.A,.res.C{border-color:#F3C9CE;background:#FFFBFB}
.res .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.res .n{color:var(--ink);font-weight:500;font-size:.95rem}
.res .v{white-space:nowrap;font-family:"Alexandria",sans-serif;font-size:1.15rem;color:var(--ink)}
.res .v small{font-family:"Readex Pro",sans-serif;font-size:.75rem;color:var(--muted);margin-inline-start:4px}
.res.A .v,.res.C .v{color:var(--red)}
.res .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px;font-size:.78rem;color:var(--muted)}
.tag{border-radius:999px;padding:2px 10px;font-size:.76rem;font-weight:600;white-space:nowrap}
.tag.ok{background:#EAF7EF;color:var(--ok)} .tag.hi{background:#FDECEE;color:var(--red)} .tag.lo{background:#EAF1FC;color:var(--blue)} .tag.cr{background:var(--red);color:#fff}
.bar{position:relative;height:6px;border-radius:6px;background:#EEF2F0;margin-top:9px}
.bar .in{position:absolute;top:0;bottom:0;border-radius:6px;background:#BFE6CC}
.bar .dot{position:absolute;top:50%;width:13px;height:13px;margin-top:-6.5px;border-radius:50%;background:var(--ok);border:2px solid #fff;box-shadow:0 0 0 1px rgba(15,34,57,.18)}
.res.A .bar .dot,.res.C .bar .dot{background:var(--red)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
button{font:inherit;border:0;border-radius:14px;padding:13px 14px;cursor:pointer;background:var(--brand);color:#fff;font-weight:600}
button.alt{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.6}
.ft{padding:0 20px 18px;font-size:.8rem;color:var(--muted)}
.priv{font-size:.78rem;color:var(--muted);text-align:center;margin:16px 10px 0}
.empty{padding:34px 24px;text-align:center}
.empty .ic{width:64px;height:64px;border-radius:18px;margin:0 auto 14px;display:grid;place-items:center;font-size:1.8rem;background:var(--paper)}
.empty h2{font-family:"Alexandria",sans-serif;color:var(--ink);font-size:1.15rem;margin:0 0 8px}
.empty.bad .ic{background:#FDECEE;color:var(--red)}
.gate{padding:22px 20px 24px}
.gate h2{font-family:"Alexandria",sans-serif;color:var(--ink);font-size:1.12rem;margin:6px 0 4px}
.gate p{margin:0 0 16px;color:var(--muted);font-size:.9rem}
.dob{display:grid;grid-template-columns:1fr 1.3fr 1.2fr;gap:8px;margin-bottom:12px}
.dob label{font-size:.78rem;color:var(--muted);display:block;margin-bottom:4px}
select{width:100%;font:inherit;font-size:16px;padding:11px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.err{color:var(--red);font-size:.86rem;min-height:1.3em;margin:4px 0 8px}
.gate button{width:100%}
.sample{background:#FFF4E0;color:#7A4A00;text-align:center;font-weight:600;padding:8px;font-size:.82rem}
.hidden{display:none!important}
.wait{padding:22px 20px 6px}
.wait .hi{font-family:"Alexandria",sans-serif;color:var(--ink);font-size:1.12rem;margin:0 0 6px}
.wait p{margin:0 0 8px}
.wait .exp{color:var(--brand2);font-weight:500}
.journey{list-style:none;margin:18px 0 10px;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:.76rem;color:var(--muted);line-height:1.35}
.journey li{position:relative;padding-top:30px}
.journey li:before{content:"";position:absolute;top:0;left:50%;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#EEF2F0;border:2px solid var(--line);box-sizing:border-box;z-index:1}
.journey li:not(:first-child):after{content:"";position:absolute;top:10px;height:2px;background:var(--line);inset-inline-start:calc(-50% + 5px);width:calc(100% - 16px)}
.journey li.done:before{background:var(--ok);border-color:var(--ok)}
.journey li.now:before{background:#fff;border:6px solid var(--brand2)}
.journey li.done:after,.journey li.now:after{background:var(--ok)}
.journey li.now{color:var(--ink);font-weight:600}
.tests{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.lbl{font-size:.8rem;color:var(--muted);margin-top:12px}
.upd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px 20px;font-size:.8rem;color:var(--muted)}
.upd button{padding:9px 18px;font-size:.88rem;flex:none}
.backbar{padding:8px 10px;background:var(--paper);border-bottom:1px solid var(--line)}
.backbar button{background:none;color:var(--brand2);padding:6px 8px;font-weight:500}
.res .o{font-size:.78rem;color:var(--muted)}
.res .prev{font-size:.78rem;color:var(--muted);margin-top:6px}
.note{font-size:.82rem;background:var(--paper);border-radius:10px;padding:8px 10px;margin-top:8px;color:var(--ink)}
.spark{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.74rem;color:var(--muted)}
.spark polyline{fill:none;stroke:var(--brand2);stroke-width:1.6}.spark circle{fill:var(--brand2)}.spark circle.now{fill:var(--ink)}.spark .band{fill:#E3F3E8}
table.abx{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:6px}table.abx td{border-bottom:1px solid var(--line);padding:4px 6px}table.abx td.abn{color:var(--red)}table.abx td.ok{color:var(--ok)}
.sum.cr{background:var(--red)}.sum.cr .big,.sum.cr .txt,.sum.cr .txt small{color:#fff}

.search{padding:14px 16px 4px}.search input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;color:var(--ink)}
.vl{padding:8px 12px 6px}
.vi{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;background:#fff;color:var(--body);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;text-align:start;font-weight:400}

.chip.st-signed{background:#EAF7EF;color:var(--ok);border-color:#CBEBD6;white-space:nowrap}.chip.st{white-space:nowrap}
a.btn{display:block;text-align:center;text-decoration:none;border-radius:14px;padding:13px 14px;background:var(--brand);color:#fff;font-weight:600}
a.btn.alt{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.empty button{margin-top:14px;padding:11px 22px}
@media print{body{background:#fff}.btns,.priv{display:none}.card{box-shadow:none}.res{break-inside:avoid}}
</style>
</head>

  var h='<div class="res '+cls+'"><div class="top"><div><div class="n">'+esc(r.name)+'</div>'+(r.other_name?'<div class="o">'+esc(r.other_name)+'</div>':'')+'</div>'+
   '<div class="v'+(/[؀-ۿ]/.test(v)?'':' mono')+'"'+(/[؀-ۿ]/.test(v)?'':' dir="ltr"')+'>'+esc(v)+(r.unit?'<small>'+esc(r.unit)+'</small>':'')+'</div></div>'+bar(v,r.range);
  if(r.range||tg)h+='<div class="meta"><span>'+(r.range?tt.range+': <span class="mono" dir="ltr">'+esc(r.range)+'</span>':'')+'</span>'+tg+'</div>';
  if(r.previous)h+='<div class="prev">'+esc(t.prev)+': <span class="mono" dir="ltr">'+esc(r.previous.value)+(r.previous.same_unit===false&&r.previous.unit?' '+esc(r.previous.unit):'')+'</span>'+(r.previous.at?' ('+ltr(when(r.previous.at))+')':'')+'</div>';
  if(r.history&&r.history.length>1)h+=spark(r);
  if(r.notes&&r.notes.length)h+='<div class="note">'+esc(r.notes.join("  "))+'</div>';
  if(r.culture)h+=cult(r.culture);
  return h+'</div>'}
 function spark(r){var p=r.history,W=150,H=34,P=4,vs=p.map(function(x){return +x.v}).filter(function(x){return !isNaN(x)});if(vs.length<2)return "";
  var lo=r.lo!=null?r.lo:null,hi=r.hi!=null?r.hi:null,all=vs.slice();if(lo!=null)all.push(lo);if(hi!=null)all.push(hi);
  var mn=Math.min.apply(null,all),mx=Math.max.apply(null,all);if(mx===mn){mx+=1;mn-=1}var pd=(mx-mn)*0.3;mn-=pd;mx+=pd;
  function y(v){return (H-P)-(v-mn)/(mx-mn)*(H-2*P)}function x(i){return P+i*(W-2*P)/Math.max(1,vs.length-1)}
  var band=(lo!=null&&hi!=null)?'<rect x="0" width="'+W+'" y="'+y(hi).toFixed(1)+'" height="'+Math.max(1,y(lo)-y(hi)).toFixed(1)+'" class="band"/>':'';
  var pts=vs.map(function(q,i){return x(i).toFixed(1)+','+y(q).toFixed(1)}).join(' ');
  var dots=vs.map(function(q,i){return '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(q).toFixed(1)+'" r="'+(i===vs.length-1?3:2)+'"'+(i===vs.length-1?' class="now"':'')+'></circle>'}).join('');
  return '<div class="spark"><svg dir="ltr" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'+band+'<polyline points="'+pts+'"/>'+dots+'</svg><span>'+esc(t.trend)+'</span></div>'}
 function cult(c){var h='';(c.organisms||[]).forEach(function(og){h+='<div class="note" dir="ltr" style="text-align:start"><strong>'+esc(og.name)+'</strong>'+(og.count?' '+esc(og.count):'')+'</div>';
   if(og.antibiotics&&og.antibiotics.length){h+='<table class="abx">';og.antibiotics.forEach(function(a){h+='<tr><td dir="ltr">'+esc(a.name)+'</td><td class="'+(a.result==="R"?"abn":a.result==="S"?"ok":"")+'">'+esc(t["abx_"+a.result]||a.result)+'</td></tr>'});h+='</table>'}});
  if(c.comment)h+='<div class="note">'+esc(c.comment)+'</div>';return h}
 // the signed PDF, sealed with the same key as the visit
 function loadPdf(v){getEnv(o.relay,"pdf",o.lid,o.sid).then(function(env){
   if(!env||!alive()||!slotOk(env,o.lid,"pdf",o.sid)||env.gone)return;
   return verifyEnv(env,o.pub).then(function(ok){if(!ok||!alive())return;return openEnv(env,key).then(function(bytes){
    if(!alive())return;var name="report-"+String(v.a||"lab").replace(/[^\w.-]+/g,"_")+".pdf",blob=new Blob([bytes],{type:"application/pdf"}),url=URL.createObjectURL(blob);
    var file=null;try{file=new File([blob],name,{type:"application/pdf"})}catch(e){}
    var b=document.getElementById("btns");if(!b)return;
    b.innerHTML='<a class="btn" id="b-open" href="'+url+'" target="_blank" rel="noopener">'+t.open+'</a><a class="btn alt" id="b-save" href="'+url+'" download="'+esc(name)+'">'+t.save+'</a>'+
     '<button type="button" class="alt" id="b-share" style="grid-column:1 / -1">'+t.share+'</button>';
    document.getElementById("b-share").onclick=function(){
     if(file&&navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file],title:t.shareText}).catch(function(){});
     else if(navigator.share)navigator.share({title:t.shareText,url:location.href}).catch(function(){});
     else if(navigator.clipboard)navigator.clipboard.writeText(location.href)}})})}).catch(function(){})}
 card.innerHTML=backBar(o)+'<div class="empty"><div class="ic">⏳</div><h2>'+esc(L.ar.opening)+'</h2></div>';wireBack(o);
 load(true)}

// ── a referring doctor's list ──
function openDoctor(o){
 var g=++GEN,t=L.ar,env=null,key=null,data=null,q="";
 function alive(){return g===GEN}
 function fetchList(){return getEnv(o.relay,"doctor",o.lid,o.sid).then(function(e){
   if(!alive())return;
   if(!e){emptyBack({},t.docNotYet,"","","⏳",[t.refresh,fetchList]);return}
   if(!slotOk(e,o.lid,"doctor",o.sid)){badPage(o.lab);return}
   return verifyEnv(e,o.pub).then(function(ok){if(!alive())return;if(!ok){badPage(o.lab);return}
    if(e.gone){emptyBack({},t.gone,t.goneP,"bad","✕");return}
    env=e;if(key)return openEnv(env,key).then(function(txt){data=JSON.parse(str(txt));list()},function(){key=null;pinGate()});pinGate()})},
  function(){if(alive())emptyBack({},t.net,t.netP,"","⚠",[t.retry,fetchList])})}
 function tries(n){try{if(n!=null)sessionStorage.setItem("lsr-pin-"+o.sid,JSON.stringify(n));var v=JSON.parse(sessionStorage.getItem("lsr-pin-"+o.sid)||"null");return v||{n:0,until:0}}catch(e){return n||tries.mem||(tries.mem={n:0,until:0})}}
 function pinGate(){
  card.innerHTML=headHtml(o.lab,t,t.listSub,false)+'<form class="gate pin" id="g"><h2>'+t.pinH+'</h2><p>'+t.pinP+'</p>'+
   '<input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" aria-label="'+esc(t.pinH)+'"><div class="err" id="er"></div><button id="go" type="submit">'+t.pinGo+'</button></form>';
  var inp=document.getElementById("pin");inp.oninput=function(){inp.value=inp.value.replace(/\D/g,"").slice(0,6)};try{inp.focus()}catch(e){}
  document.getElementById("g").onsubmit=function(ev){ev.preventDefault();
   var er=document.getElementById("er"),btn=document.getElementById("go"),pin=inp.value,st=tries();
   if(st.until>Date.now()){er.textContent=t.pinLock;return}
   if(!/^\d{6}$/.test(pin)){er.textContent=t.pinShort;return}
   btn.disabled=true;er.textContent="";btn.textContent=t.opening;
   pbkKey(o.k+"|"+pin,"lsr-doctor|"+o.sid).then(function(k){return openEnv(env,k).then(function(txt){key=k;tries({n:0,until:0});data=JSON.parse(str(txt));list()})})
    .catch(function(){if(!alive())return;var s2=tries(),n=s2.n+1;tries({n:n>=5?0:n,until:n>=5?Date.now()+30000:0});
     btn.disabled=false;btn.textContent=t.pinGo;er.textContent=n>=5?t.pinLock:t.pinWrong;inp.value="";try{inp.focus()}catch(e){}})}}
 function list(){
  if(!alive())return;setLang(false,t.privDoc);
  var lab=o.lab;card.innerHTML=headHtml(lab,t,t.listH,false)+(data.doctor?'<div class="pt" style="padding-bottom:0"><div class="name" style="font-size:1.05rem">'+esc(data.doctor)+'</div></div>':'')+
   '<div class="search"><input id="q" type="search" placeholder="'+esc(t.search)+'" value="'+esc(q)+'"></div><div class="vl" id="vl"></div>'+
   '<div class="upd"><span>'+esc(t.last)+': '+ltr(when(data.updated,true))+'</span><button type="button" class="alt" id="b-ref">'+esc(t.refresh)+'</button></div>';
  var inp=document.getElementById("q");inp.oninput=function(){q=inp.value;items()};
  document.getElementById("b-ref").onclick=function(){this.disabled=true;fetchList()};items()}
 function items(){var vs=(data.visits||[]).slice().sort(function(a,b){return String(b.at||"").localeCompare(String(a.at||""))}),qq=q.trim().toLowerCase();
  if(qq)vs=vs.filter(function(v){return (String(v.name||"")+" "+String(v.a||"")).toLowerCase().indexOf(qq)>=0});
  var el=document.getElementById("vl");if(!el)return;
  if(!vs.length){el.innerHTML='<p class="ft" style="text-align:center;padding:18px">'+esc(qq?t.noMatch:t.none)+'</p>';return}
  el.innerHTML=vs.map(function(v,i){return '<button type="button" class="vi" data-i="'+i+'"><span><b>'+esc(v.name)+'</b><small>'+esc([v.age,v.sex].filter(Boolean).join(" · "))+(v.a?' · '+ltr(v.a):'')+' · '+ltr(when(v.at))+'</small></span><span class="chip st '+(v.stage==="signed"?"st-signed":"")+'">'+esc(t.st[v.stage]||v.stage||"")+'</span></button>'}).join("");
  Array.prototype.forEach.call(el.querySelectorAll(".vi"),function(b){b.onclick=function(){openFromList(vs[+b.getAttribute("data-i")])}})}
 function openFromList(v){var p=String(v.link||"").split(".");if(p.length!==4||(p[0]!=="3"&&p[0]!=="4"))return;
  var lab=labOf(p[1])||o.lab;
  pubOf(lab).then(function(pub){openVisit({ver:p[0],lid:p[1],sid:p[2],k:p[3],dob:v.dob||"",lab:lab,pub:pub,relay:relayFor(lab),
   back:function(){GEN++;g=GEN;setLang(false,t.privDoc);list();window.scrollTo(0,0)}});window.scrollTo(0,0)})}
 card.innerHTML='<div class="empty"><div class="ic">⏳</div><h2>'+esc(t.opening)+'</h2></div>';
 fetchList()}
})();
